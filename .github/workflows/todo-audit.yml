name: TODO/FIXME audit

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: Free model for this manual run (no automatic fallback)
        type: choice
        required: false
        default: opencode/big-pickle
        options:
          - opencode/big-pickle
          - opencode/mimo-v2.6-flash-free
      source_run_id:
        description: Replay this workflow's input snapshot from a completed main run
        type: string
        required: false

permissions: {}

concurrency:
  group: todo-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      ready: ${{ steps.analyze.outcome == 'success' }}
    steps:
      - name: Checkout trusted main event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.19
      - name: Collect input snapshot
        if: inputs.source_run_id == ''
        env:
          OSV_SCANNER: ${{ runner.temp }}/osv-scanner
        run: node scripts/audit.mjs collect todo "$RUNNER_TEMP/audit"
      - name: Replay validated same-workflow input snapshot
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/audit.mjs replay todo "$RUNNER_TEMP/audit"
      - name: Save immutable input snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: todo-audit-input
          path: ${{ runner.temp }}/audit/input.json
          retention-days: 30
          if-no-files-found: warn
      - name: Analyze read-only snapshot
        id: analyze
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AUDIT_MODEL: ${{ inputs.model || 'opencode/big-pickle' }}
        run: mise exec opencode@1.19.5 -- node scripts/audit.mjs analyze todo "$RUNNER_TEMP/audit"
      - name: Report final audit status
        run: node scripts/audit.mjs status todo "$RUNNER_TEMP/audit"
      - name: Write Actions summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/audit/report.md"; then
            cat "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$RUNNER_TEMP/audit"
            echo 'Error: audit setup failed; inspect workflow logs.' | tee "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save analysis and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: todo-audit-report
          path: ${{ runner.temp }}/audit/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: audit
    if: always() && github.ref == 'refs/heads/main' && needs.audit.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout trusted publisher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.19
      - name: Download data only from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: todo-audit-report
          path: ${{ runner.temp }}/audit
      - name: Publish deterministic decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout -k 10s 600s node scripts/audit.mjs publish todo "$RUNNER_TEMP/audit"
      - name: Write publication summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/audit/report.md"; then
            cat "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$RUNNER_TEMP/audit"
            echo 'Error: publisher setup failed; inspect workflow logs.' | tee "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save publication decisions even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: todo-audit-publication
          path: ${{ runner.temp }}/audit/
          retention-days: 30
          if-no-files-found: error
