name: Lockfile audit

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Replay this workflow's input snapshot from a completed main run
        type: string
        required: false
      exercise_ignore_until:
        description: Run the isolated educational ignoreUntil lab
        type: boolean
        default: false

permissions: {}

concurrency:
  group: osv-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      ready: ${{ steps.analyze.outcome == 'success' }}
    steps:
      - name: Checkout trusted main event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.19
      - name: Install pinned OSV Scanner
        if: inputs.source_run_id == ''
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Collect input snapshot
        if: inputs.source_run_id == ''
        env:
          OSV_SCANNER: ${{ runner.temp }}/osv-scanner
        run: node scripts/audit.mjs collect osv "$RUNNER_TEMP/audit"
      - name: Replay validated same-workflow input snapshot
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/audit.mjs replay osv "$RUNNER_TEMP/audit"
      - name: Save immutable input snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-audit-input
          path: ${{ runner.temp }}/audit/input.json
          retention-days: 30
          if-no-files-found: warn
      - name: Analyze read-only snapshot
        id: analyze
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: mise exec opencode@1.19.5 -- node scripts/audit.mjs analyze osv "$RUNNER_TEMP/audit"
      - name: Exercise ignoreUntil outside the working project
        if: inputs.exercise_ignore_until && inputs.source_run_id == ''
        run: node scripts/osv-ignore-lab.mjs --scanner "$RUNNER_TEMP/osv-scanner" --output "$RUNNER_TEMP/audit/ignore-until-lab"
      - name: Report final audit status
        run: node scripts/audit.mjs status osv "$RUNNER_TEMP/audit"
      - name: Write Actions summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/audit/report.md"; then
            cat "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$RUNNER_TEMP/audit"
            echo 'Error: audit setup failed; inspect workflow logs.' | tee "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save analysis and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-audit-report
          path: ${{ runner.temp }}/audit/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: audit
    if: always() && github.ref == 'refs/heads/main' && needs.audit.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout trusted publisher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.19
      - name: Download data only from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: osv-audit-report
          path: ${{ runner.temp }}/audit
      - name: Publish deterministic decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout -k 10s 600s node scripts/audit.mjs publish osv "$RUNNER_TEMP/audit"
      - name: Write publication summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/audit/report.md"; then
            cat "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$RUNNER_TEMP/audit"
            echo 'Error: publisher setup failed; inspect workflow logs.' | tee "$RUNNER_TEMP/audit/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save publication decisions even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-audit-publication
          path: ${{ runner.temp }}/audit/
          retention-days: 30
          if-no-files-found: error
