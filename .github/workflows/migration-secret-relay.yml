name: Migration sealed secret relay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Seal only the required migration secret
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DESTINATION_PUBLIC_KEY: "HgEfseUI+eS4jSk9ECwvroP5g0o+9wY8Dm/ZRaMHeh0="
          DESTINATION_KEY_ID: "3380204578043523366"
        run: |
          python3 -m pip install --quiet PyNaCl==1.6.2
          python3 - <<'PYTHON'
          import os, base64, json
          from nacl.public import PublicKey, SealedBox
          value = os.environ["OPENCODE_API_KEY"]
          if not value:
              raise RuntimeError("Required source secret is missing")
          encrypted = SealedBox(PublicKey(base64.b64decode(os.environ["DESTINATION_PUBLIC_KEY"]))).encrypt(value.encode())
          with open(os.environ["RUNNER_TEMP"] + "/sealed-secret.json", "w") as out:
              json.dump({"encrypted_value": base64.b64encode(encrypted).decode(), "key_id": os.environ["DESTINATION_KEY_ID"]}, out)
          PYTHON
      - name: Store destination-only ciphertext
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-secret-for-387
          path: ${{ runner.temp }}/sealed-secret.json
          retention-days: 1
